name: Continuous Integration & Automated Testing

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-build-test:
    name: Backend Build & Unit/Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pos_billing_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Backend Dependencies
        run: dotnet restore Backend/PosBackend.csproj

      - name: Build Backend with Strict Warnings
        run: dotnet build Backend/PosBackend.csproj -c Release -warnaserror

      - name: Run Backend Unit & Integration Tests
        run: dotnet test Backend.Tests/Backend.Tests.csproj --configuration Release --logger "console;verbosity=detailed"
        env:
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=pos_billing_db;Username=postgres;Password=root;

  frontend-build-test:
    name: Frontend Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'POSUI/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./POSUI
        run: npm ci --legacy-peer-deps

      - name: Run Frontend Unit Tests
        working-directory: ./POSUI
        run: npm test

      - name: Build Frontend Production Bundle
        working-directory: ./POSUI
        run: npm run build
